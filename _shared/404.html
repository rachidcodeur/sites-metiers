<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable</title>
<meta name="robots" content="noindex, follow">
<!-- Styles en ligne volontairement : cette page doit s'afficher correctement
     même sur un sous-domaine de commune inexistant, où /assets/ n'est pas
     forcément servi. Aucune dépendance externe. -->
<style>
  :root{--accent:#BC5A00;--bg:#FBF8F3;--ink:#1A1815;--ink-2:#4A453E;--line:#E7E1D6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.6}
  main{max-width:520px;text-align:center}
  .code{font-size:13px;letter-spacing:.14em;text-transform:uppercase;
        color:var(--accent);font-weight:600;margin-bottom:14px}
  h1{font-size:32px;line-height:1.15;letter-spacing:-.02em;margin-bottom:14px}
  p{color:var(--ink-2);margin-bottom:28px}
  a{display:inline-flex;align-items:center;gap:8px;background:var(--accent);
    color:#fff;text-decoration:none;font-weight:600;font-size:15px;
    padding:13px 26px;border-radius:999px}
  a:hover{background:#A34E00}
  @media(prefers-color-scheme:dark){
    :root{--bg:#1A1815;--ink:#FBF8F3;--ink-2:#C9C2B8;--line:#3A352E}
  }
</style>
</head>
<body>
<main>
  <p class="code">Erreur 404</p>
  <h1>Cette page n'existe pas</h1>
  <p>Le lien est peut-être incorrect ou la page a été déplacée.</p>
  <a href="/">Retour à l'accueil</a>
</main>
</body>
</html>
